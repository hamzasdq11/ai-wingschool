    <!-- Structured data: AI Builder Program course (home + register) -->
    <script type="application/ld+json" data-routes="/ /register">
      {
        "@context": "https://schema.org",
        "@type": "Course",
        "name": "AI Builder Program",
        "description": "A four-week live online program where students of Classes 6–10 learn how modern AI actually works and build a real AI project of their own, mentored by graduates of IIT Madras, IIT Ropar, IIM Bangalore, and IIM Ranchi. A hardware kit of Arduino, sensors, and robotics is shipped to each student. The program ends with a stage presentation at Flagship Expo Day before a panel of industry experts and IIT/IIM alumni. Admission is decided purely by WingsQuest Challenge score; the top 10–20% of scorers earn 25–50% merit scholarships.",
        "provider": { "@id": "https://www.aiwingschool.com/#organization" },
        "educationalLevel": "Classes 6–10",
        "inLanguage": "en-IN",
        "teaches": [
          "How modern AI and neural networks work",
          "Building AI projects end to end",
          "Arduino, sensors, and robotics",
          "Presenting technical work on stage"
        ],
        "offers": {
          "@type": "Offer",
          "category": "Paid",
          "priceCurrency": "INR"
        },
        "hasCourseInstance": {
          "@type": "CourseInstance",
          "courseMode": "Online",
          "courseWorkload": "Four weeks of live online sessions"
        }
      }
    </script>

    <!-- Structured data: FAQ (home only) -->
    <script type="application/ld+json" data-routes="/">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need to know coding?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The WingsQuest Challenge tests reasoning and curiosity, not programming; there's no code in it. And the AI Builder Program starts from zero. Technical confidence grows by making things, not by intimidation."
            }
          },
          {
            "@type": "Question",
            "name": "How much does it cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "There is no fee to sit the Challenge. Admission to the AI Builder Program is decided purely on your score. The Builder Program itself is a paid program, with 25–50% merit scholarships for the top 10–20% of scorers; the fee is shared directly with parents before anything is due."
            }
          },
          {
            "@type": "Question",
            "name": "Will this clash with school and tuitions?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Challenge is one hour, online, from home. Challenge Day is 28 August. The Builder Program is four weeks of live online sessions designed to fit around school life."
            }
          },
          {
            "@type": "Question",
            "name": "What if I don't clear the cutoff?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You still keep your participation certificate and your private score band, and you'll know exactly where you stand. The skills WingsQuest tests are buildable, and the Challenge will run again."
            }
          },
          {
            "@type": "Question",
            "name": "Who actually teaches?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Mentors are graduates of IIT Madras, IIT Ropar, IIM Bangalore, and IIM Ranchi, most with industry experience at AI-first startups."
            }
          },
          {
            "@type": "Question",
            "name": "What does a student walk away with?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every participant gets a WingsQuest 2026 certificate. Qualifiers who finish the Builder Program add a real AI project they built themselves and a project-completion certificate, presented on stage at Flagship Expo Day."
            }
          }
        ]
      }
    </script>
